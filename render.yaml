services:
  - type: web
    name: common-room-web
    runtime: static
    buildCommand: npm ci --include=dev && npm run build -w @office/web
    staticPublishPath: apps/web/dist
    envVars:
      # Left empty on purpose: the browser calls /api on this site and the rewrite below
      # proxies to the API, which keeps the session cookie first-party.
      - key: VITE_API_URL
        value: ""
    routes:
      # Update the destination host if Render assigned the API service a different hostname.
      - type: rewrite
        source: /api/*
        destination: https://common-room-api.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: common-room-api
    runtime: node
    plan: starter
    buildCommand: npm ci --include=dev && npm run build -w @office/api
    startCommand: npm run start -w @office/api
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: WEB_ORIGIN
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: common-room-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: AGORA_APP_ID
        sync: false
      - key: AGORA_APP_CERTIFICATE
        sync: false

  - type: worker
    name: common-room-worker
    runtime: docker
    plan: starter
    dockerfilePath: ./apps/worker/Dockerfile
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: common-room-db
          property: connectionString
      - key: AGORA_APP_ID
        sync: false
      - key: AGORA_APP_CERTIFICATE
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: openai/gpt-5.6-luna
      - key: EMPTY_ROOM_GRACE_MS
        value: 10000

databases:
  - name: common-room-db
    plan: basic-256mb
    databaseName: common_room
    user: common_room
