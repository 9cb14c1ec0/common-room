services:
  - type: web
    name: common-room-web
    runtime: static
    buildCommand: npm ci --include=dev && npm run build -w @office/web
    staticPublishPath: apps/web/dist
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: common-room-api
    runtime: node
    plan: starter
    buildCommand: npm ci --include=dev && npm run build -w @office/api
    startCommand: npm run start -w @office/api
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: common-room-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true

  - type: worker
    name: common-room-worker
    runtime: node
    plan: starter
    buildCommand: npm ci --include=dev && npm run build -w @office/worker
    startCommand: npm run start -w @office/worker
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: common-room-db
          property: connectionString

databases:
  - name: common-room-db
    plan: basic-256mb
    databaseName: common_room
    user: common_room
