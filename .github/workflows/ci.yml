name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  vm-images:
    runs-on: ubuntu-latest
    env:
      DOMAIN: ci.example.com
      POSTGRES_PASSWORD: ci
      SESSION_SECRET: ci-session-secret-with-at-least-32-chars
      BOOTSTRAP_ADMIN_EMAIL: admin@example.com
      BOOTSTRAP_ADMIN_PASSWORD: ci-password-123
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: docker compose -f deploy/compose.yaml config --quiet
      - run: docker run --rm -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" -e DOMAIN caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile
      - run: docker compose -f deploy/compose.yaml build
      # Exercise the data-migration path: migrate and seed via the API, export both locally and
      # through a connection URL (the Render path), wipe the data, import, and check it is back.
      # The web service is left out because Caddy would try to obtain a real certificate.
      - name: Export and import round trip
        run: |
          set -euo pipefail
          compose() { docker compose -f deploy/compose.yaml "$@"; }
          sql() { compose exec -T db psql -X -At -v ON_ERROR_STOP=1 -U common_room -d common_room -c "$1"; }
          healthy() {
            for _ in $(seq 30); do
              if compose exec -T api node -e "fetch('http://localhost:4000/health').then(r=>r.json()).then(j=>process.exit(j.database==='connected'?0:1),()=>process.exit(1))"; then return 0; fi
              sleep 2
            done
            compose logs api; return 1
          }
          compose up -d --wait db
          compose up -d api worker
          healthy
          test "$(sql 'SELECT email FROM users')" = admin@example.com
          # A value only the archive can bring back; bootstrap alone would recreate "Administrator".
          sql "UPDATE users SET display_name='Exported admin'"
          ./deploy/db-export.sh > local.dump
          ./deploy/db-export.sh "postgresql://common_room:ci@db:5432/common_room" > url.dump
          test -s local.dump && test -s url.dump
          if ./deploy/db-import.sh --yes missing.dump; then exit 1; fi
          sql 'TRUNCATE users CASCADE'
          ./deploy/db-import.sh --yes url.dump
          healthy
          test "$(sql 'SELECT display_name FROM users')" = 'Exported admin'
          test "$(sql 'SELECT count(*) FROM schema_migrations')" -gt 0
      - if: always()
        run: docker compose -f deploy/compose.yaml down -v
